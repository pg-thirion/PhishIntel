name: PhishIntel CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q --cov=phishintel --cov-report=term-missing
      - run: python -m phishintel.evaluate
      - run: python -m compileall -q phishintel app.py
      - run: bandit -r phishintel -lll
      - run: pip-audit
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t phishintel:ci .
      - run: docker run --rm --entrypoint id phishintel:ci -u | grep -x 10001
